name: Instalador Windows

# Gera o instalador (.exe) do Matrizes numa máquina Windows na nuvem.
#  - Push comum na branch: só compila e guarda o instalador como "artifact"
#    (prova que o build funciona), sem publicar nada.
#  - Push cujo commit contém "[release]" (ou uma tag "v*"): compila E publica um
#    Release do GitHub com o instalador + latest.yml (o que a atualização
#    automática lê). A versão publicada vem do package.json. O próprio Actions
#    cria a tag/Release com o token do GitHub — não é preciso empurrar tag à mão.
on:
  push:
    branches:
      - claude/project-progress-check-11rlq4
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # windows-2022 (Visual Studio 2022): a imagem windows-latest migrou para um
    # Visual Studio mais novo que o node-gyp ainda não reconhece, quebrando a
    # compilação dos módulos nativos (better-sqlite3). Fixar em 2022 resolve.
    runs-on: windows-2022

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Compilar o app
        run: npm run build:app

      # Empacota o instalador NSIS. --publish never: nunca publica direto daqui;
      # a publicação do Release é feita no passo abaixo, só para tags.
      # electron-builder ainda gera o latest.yml por causa da config `publish`.
      - name: Gerar o instalador
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar os arquivos (download pela aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Matrizes-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      # Lê a versão do package.json para nomear a tag/Release (ex.: v0.1.0).
      - name: Descobrir a versão
        id: versao
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar Release (commits com [release] ou tags v*)
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          name: Matrizes ${{ steps.versao.outputs.tag }}
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.zip
            dist/latest.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
