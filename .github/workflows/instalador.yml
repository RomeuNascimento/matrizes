name: Instalador do Windows

# A fábrica de instalador: monta o .exe num Windows de verdade, sem precisar de
# um PC Windows à mão. Rode manualmente pela aba Actions ("Run workflow") ou
# publique uma tag de versão (ex.: v1.0.0) para gerar também a Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verificar:
    name: Testes e tipos (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app

  instalador:
    name: Empacotar instalador (Windows)
    needs: verificar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Montar o instalador
        # O electron-builder recompila better-sqlite3 e sharp para a ABI do
        # Electron (npmRebuild: true no electron-builder.yml).
        run: npm run dist

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Matrizes-instalador-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar na Release (só quando é uma tag de versão)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
