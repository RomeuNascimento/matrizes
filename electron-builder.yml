appId: com.matrizes.app
productName: Matrizes
copyright: Matrizes
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Recompila módulos nativos (better-sqlite3, sharp) para a ABI do Electron.
npmRebuild: true
# Módulos com binário nativo precisam ficar fora do asar para poderem ser carregados.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-instalador.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Matrizes
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # NUNCA remover dados da usuária ao desinstalar.
  deleteAppDataOnUninstall: false
