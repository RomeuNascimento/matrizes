appId: com.matrizes.app
productName: Matrizes
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Recompila módulos nativos (better-sqlite3, sharp) para a ABI do Electron.
npmRebuild: true
# Onde o app instalado procura novas versões (Releases públicos do GitHub).
# Também faz o build gerar o `latest.yml`, que a atualização automática usa.
publish:
  provider: github
  owner: RomeuNascimento
  repo: matrizes
win:
  target:
    # nsis  = instalador de clique-duplo (.exe)
    # zip   = versão "sem instalação": descompacta e abre Matrizes.exe. Costuma
    #         passar mais fácil pelo SmartScreen por não ser um instalador.
    - nsis
    - zip
  # Instalador vira Matrizes-0.1.x.exe; a versão sem-instalação, Matrizes-0.1.x.zip.
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # NUNCA remover dados da usuária ao desinstalar.
  deleteAppDataOnUninstall: false
